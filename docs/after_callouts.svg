<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1367" height="1188" viewBox="0 0 1367 1188">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c53b35"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".25"/>
    </filter>
  </defs>
  <image x="0" y="0" width="1367" height="1188" xlink:href="../examples/almaty/after.png"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#8f2d28" stroke="#fff" stroke-width="5" paint-order="stroke" filter="url(#shadow)">
    <text x="80" y="95">① рекомендации проходят геометрический аудит</text>
    <text x="890" y="110">② яркие точки — выбранные деревья</text>
    <text x="850" y="1030">③ цвет точек — относительный индекс жары</text>
  </g>
  <g stroke="#c53b35" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M390,103 L690,350"/>
    <path d="M1020,125 L1030,490"/>
    <path d="M1040,1010 L840,770"/>
  </g>
</svg>
